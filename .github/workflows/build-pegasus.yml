name: Build Pegasus Frontend ARM64

on:
  workflow_dispatch:

jobs:
  build-pegasus:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Native Build in ARM64 Docker Container
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:24.04 /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            
            echo '>>> 1. 安装 Qt5 与底层图形依赖...'
            # 移除了在 24.04 中找不到的旧模块名，保留核心包
            apt-get install -y git build-essential cmake ninja-build \
              qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev libqt5svg5-dev \
              qml-module-qtmultimedia qml-module-qtquick-layouts \
              qml-module-qtquick-controls2 qml-module-qtquick2 \
              libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

            echo '>>> 2. 拉取 Pegasus 源码...'
            git clone --recursive https://github.com/mmatyas/pegasus-frontend.git
            cd pegasus-frontend
            
            echo '>>> 3. 开始原生编译 (这大约需要 10-15 分钟)...'
            cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release
            ninja -C build
            
            echo '>>> 4. 提取产物...'
            cp build/pegasus-frontend /workspace/
          "

      - name: Upload Pegasus Binary
        uses: actions/upload-artifact@v4
        with:
          name: pegasus-arm64
          path: pegasus-frontend
